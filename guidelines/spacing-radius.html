<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:var(--space-5);display:flex;gap:var(--space-5);flex-wrap:wrap;}
  .item{text-align:center;}
  .box{width:84px;height:64px;background:var(--navy-700);}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:6px;}
</style></head><body>
  <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="lbl">xs 3</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl">sm 6</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl">md 10</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl">lg 16</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lbl">xl 24</div></div>
  <div class="item"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="lbl">pill</div></div>
</body></html>
