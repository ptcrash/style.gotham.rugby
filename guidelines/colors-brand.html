<!-- @dsCard group="Colors" viewport="700x190" name="Brand Heroes" subtitle="Navy + Gold, sampled from the crest" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);padding:var(--space-5);}
  .sw{border-radius:var(--radius-md);padding:var(--space-5);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;border:var(--bw-base) solid transparent;}
  .name{font-weight:var(--fw-extrabold);font-size:var(--fs-body-lg);}
  .hex{font-family:var(--font-mono);font-size:var(--fs-body-sm);opacity:.85;}
</style></head><body>
  <div class="wrap">
    <div class="sw" style="background:var(--navy-700);color:#fff;">
      <span class="name">Knight Navy</span><span class="hex">#0D1D41 · --navy-700</span>
    </div>
    <div class="sw" style="background:var(--gold-500);color:var(--navy-700);">
      <span class="name">Gotham Gold</span><span class="hex">#FEC526 · --gold-500</span>
    </div>
  </div>
</body></html>
