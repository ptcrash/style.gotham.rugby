<!-- @dsCard group="Colors" viewport="700x150" name="Gold Scale" subtitle="The accent — CTAs, highlights, the signature rule" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);}
  .row{display:flex;padding:var(--space-5);gap:var(--space-2);}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border-radius:var(--radius-sm);padding:var(--space-2);color:var(--navy-700)}
  .t{font-family:var(--font-mono);font-size:10px;font-weight:600;}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:var(--gold-700);color:#fff"><span class="t">700</span></div>
    <div class="sw" style="background:var(--gold-600)"><span class="t">600</span></div>
    <div class="sw" style="background:var(--gold-500)"><span class="t">500</span></div>
    <div class="sw" style="background:var(--gold-400)"><span class="t">400</span></div>
    <div class="sw" style="background:var(--gold-300)"><span class="t">300</span></div>
    <div class="sw" style="background:var(--gold-200)"><span class="t">200</span></div>
    <div class="sw" style="background:var(--gold-100)"><span class="t">100</span></div>
  </div>
</body></html>
