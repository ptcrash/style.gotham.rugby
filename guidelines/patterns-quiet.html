<!-- @dsCard group="Patterns" viewport="1040x320" name="Quiet Patterns" subtitle="Fine fade · spotlight · crest watermark · pinstripe + pride" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:var(--space-5);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-5);}
  .sw{height:150px;border-radius:var(--radius-sm);border:var(--bw-base) solid var(--navy-700);overflow:hidden;}
  .code{font-family:var(--font-mono);font-size:12px;color:var(--text-strong);font-weight:var(--fw-semibold);margin-top:10px;}
  .lbl{font-family:var(--font-body);font-size:12px;color:var(--text-muted);margin-top:2px;}
  .hed{font-family:var(--font-heading);font-weight:var(--fw-extrabold);color:var(--text-strong);font-size:15px;letter-spacing:var(--ls-tight);margin:0 0 var(--space-4);}
</style></head><body>
  <p class="hed">Quiet patterns — texture without the shout</p>
  <div class="grid">
    <div><div class="sw gk-halftone-fade"></div><div class="code">.gk-halftone-fade</div><div class="lbl">Decks, grants, sponsors.</div></div>
    <div><div class="sw gk-halftone-spotlight" style="--gk-spot-x:34%;"></div><div class="code">.gk-halftone-spotlight</div><div class="lbl">Behind a face or kit number.</div></div>
    <div><div class="sw gk-crest-watermark"></div><div class="code">.gk-crest-watermark</div><div class="lbl">Navy panels, covers.</div></div>
    <div><div class="sw gk-pinstripe" style="display:flex;align-items:flex-end;"><div class="gk-pride-rule" style="width:100%;height:5px;border-radius:0;"></div></div><div class="code">.gk-pinstripe + .gk-pride-rule</div><div class="lbl">One-pagers · the Pride moment.</div></div>
  </div>
</body></html>
