<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="4px base ramp" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:var(--space-5);}
  .row{display:flex;align-items:center;gap:var(--space-3);margin-bottom:6px;}
  .bar{background:var(--gold-500);height:14px;border-radius:2px;}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);width:120px;}
</style></head><body>
  <div class="row"><span class="lbl">1 · 4px</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="lbl">2 · 8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="lbl">3 · 12px</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="lbl">4 · 16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="lbl">5 · 24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="lbl">6 · 32px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="lbl">7 · 48px</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="lbl">8 · 64px</span><div class="bar" style="width:64px"></div></div>
</body></html>
