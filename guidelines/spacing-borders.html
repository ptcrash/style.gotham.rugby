<!-- @dsCard group="Spacing" viewport="760x230" name="Borders & Motion" subtitle="Confident 2px stroke · quick, decisive easing (live)" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:var(--space-5);}
  .head{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin:0 0 var(--space-3);}
  .borders{display:flex;gap:var(--space-6);align-items:center;}
  .item{text-align:center;}
  .box{width:78px;height:46px;border-radius:var(--radius-md);border-style:solid;border-color:var(--navy-700);}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:7px;}

  .motion{margin-top:var(--space-5);}
  .track{position:relative;display:flex;align-items:center;gap:var(--space-3);margin-bottom:10px;}
  .tname{font-family:var(--font-mono);font-size:11px;color:var(--text-strong);width:118px;flex:none;}
  .rail{position:relative;flex:1;height:18px;background:var(--surface-sunken);border-radius:var(--radius-pill);}
  .knob{position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--gold-500);}
  @media (prefers-reduced-motion:no-preference){
    .knob{animation:gk-run 2.4s infinite;}
    .t-fast .knob{animation-timing-function:var(--ease-standard);animation-delay:0s;}
    .t-base .knob{animation-timing-function:var(--ease-out);animation-delay:.12s;}
    .t-in   .knob{animation-timing-function:var(--ease-in);animation-delay:.24s;}
  }
  @keyframes gk-run{
    0%, 8%   {left:3px;}
    42%, 58% {left:calc(100% - 15px);}
    92%,100% {left:3px;}
  }
  .ease{font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-top:6px;}
  .ease b{color:var(--text-strong);font-weight:var(--fw-semibold);}
</style></head><body>
  <p class="head">Borders</p>
  <div class="borders">
    <div class="item"><div class="box" style="border-width:1px"></div><div class="lbl">hairline 1px</div></div>
    <div class="item"><div class="box" style="border-width:2px"></div><div class="lbl">base 2px</div></div>
    <div class="item"><div class="box" style="border-width:3px;border-color:var(--gold-500)"></div><div class="lbl">bold 3px</div></div>
  </div>

  <div class="motion">
    <p class="head">Motion — quick &amp; decisive, no bounce</p>
    <div class="track t-fast"><span class="tname">standard</span><div class="rail"><div class="knob"></div></div></div>
    <div class="track t-base"><span class="tname">ease-out</span><div class="rail"><div class="knob"></div></div></div>
    <div class="track t-in"><span class="tname">ease-in</span><div class="rail"><div class="knob"></div></div></div>
    <p class="ease"><b>standard</b> cubic-bezier(.2,0,0,1) &nbsp;·&nbsp; durations <b>fast 120</b> · <b>base 200</b> · <b>slow 320ms</b></p>
  </div>
</body></html>
