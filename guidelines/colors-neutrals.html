<!-- @dsCard group="Colors" viewport="700x150" name="Warm Neutrals" subtitle="Cream paper + warm ink — never clinical white" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);}
  .row{display:flex;padding:var(--space-5);gap:var(--space-2);}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border-radius:var(--radius-sm);padding:var(--space-2);border:1px solid var(--border);}
  .t{font-family:var(--font-mono);font-size:10px;font-weight:600;}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:var(--paper);color:var(--ink-700)"><span class="t">paper</span></div>
    <div class="sw" style="background:var(--paper-2);color:var(--ink-700)"><span class="t">paper-2</span></div>
    <div class="sw" style="background:var(--ink-200);color:var(--ink-700)"><span class="t">ink-200</span></div>
    <div class="sw" style="background:var(--ink-400);color:#fff"><span class="t">ink-400</span></div>
    <div class="sw" style="background:var(--ink-500);color:#fff"><span class="t">ink-500</span></div>
    <div class="sw" style="background:var(--ink-700);color:#fff"><span class="t">ink-700</span></div>
    <div class="sw" style="background:var(--ink-900);color:#fff"><span class="t">ink-900</span></div>
  </div>
</body></html>
