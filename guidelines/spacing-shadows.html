<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows" subtitle="Navy-tinted, restrained · gold glow for hero CTA" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:var(--space-6);display:flex;gap:var(--space-6);flex-wrap:wrap;}
  .item{text-align:center;}
  .box{width:96px;height:64px;background:var(--white);border-radius:var(--radius-md);}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:10px;}
</style></head><body>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="lbl">xs</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lbl">sm</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lbl">md</div></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lbl">lg</div></div>
  <div class="item"><div class="box" style="background:var(--gold-500);box-shadow:var(--shadow-gold)"></div><div class="lbl">gold</div></div>
</body></html>
