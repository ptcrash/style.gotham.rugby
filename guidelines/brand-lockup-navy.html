<!-- @dsCard group="Brand" viewport="700x240" name="Lockup on Navy" subtitle="2-color and all-white lockups on the matchday field" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--navy-700);padding:var(--space-6) var(--space-5);display:flex;gap:var(--space-6);align-items:center;justify-content:center;}
  .cell{flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--space-4);}
  .lockup{display:flex;align-items:center;gap:var(--space-4);}
  .divider{width:1px;align-self:stretch;background:rgba(255,255,255,0.14);}
  .tag{font-family:var(--font-body);font-weight:700;text-transform:uppercase;letter-spacing:0.16em;font-size:11px;color:var(--navy-200);}
  img{display:block;}
</style></head><body>
  <div class="cell">
    <div class="lockup">
      <img style="height:92px" src="../assets/logos/shield-2c.svg" alt="Gotham Knights crest">
      <img style="height:66px" src="../assets/logos/wordmark-inv.svg" alt="Gotham Knights Rugby Football Club">
    </div>
    <span class="tag">2-color</span>
  </div>
  <div class="divider"></div>
  <div class="cell">
    <div class="lockup">
      <img style="height:92px" src="../assets/logos/shield-inv.svg" alt="Gotham Knights crest">
      <img style="height:66px" src="../assets/logos/wordmark-inv.svg" alt="Gotham Knights Rugby Football Club">
    </div>
    <span class="tag">All-white</span>
  </div>
</body></html>
