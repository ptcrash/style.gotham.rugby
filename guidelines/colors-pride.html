<!-- @dsCard group="Colors" viewport="700x170" name="Pride Spectrum" subtitle="Accent only — a deliberate moment, never the default" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);}
  .pad{padding:var(--space-5);}
  .row{display:flex;gap:var(--space-2);}
  .sw{flex:1;height:64px;border-radius:var(--radius-sm);}
  hr.gk-pride-rule{margin-top:var(--space-4);height:6px;}
  .cap{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);margin-top:var(--space-3);}
</style></head><body>
  <div class="pad">
    <div class="row">
      <div class="sw" style="background:var(--pride-red)"></div>
      <div class="sw" style="background:var(--pride-orange)"></div>
      <div class="sw" style="background:var(--pride-yellow)"></div>
      <div class="sw" style="background:var(--pride-green)"></div>
      <div class="sw" style="background:var(--pride-blue)"></div>
      <div class="sw" style="background:var(--pride-violet)"></div>
      <div class="sw" style="background:var(--pride-trans-blue)"></div>
      <div class="sw" style="background:var(--pride-trans-pink)"></div>
      <div class="sw" style="background:var(--pride-brown)"></div>
      <div class="sw" style="background:var(--pride-black)"></div>
    </div>
    <hr class="gk-pride-rule">
    <div class="cap">.gk-pride-rule — the sanctioned spectrum accent</div>
  </div>
</body></html>
