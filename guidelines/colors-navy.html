<!-- @dsCard group="Colors" viewport="700x150" name="Navy Scale" subtitle="The anchor — surfaces in loud mode, ink in light" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);}
  .row{display:flex;padding:var(--space-5);gap:var(--space-2);}
  .sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border-radius:var(--radius-sm);padding:var(--space-2);}
  .t{font-family:var(--font-mono);font-size:10px;font-weight:600;}
</style></head><body>
  <div class="row">
    <div class="sw" style="background:var(--navy-900);color:#fff"><span class="t">900</span></div>
    <div class="sw" style="background:var(--navy-800);color:#fff"><span class="t">800</span></div>
    <div class="sw" style="background:var(--navy-700);color:#fff"><span class="t">700</span></div>
    <div class="sw" style="background:var(--navy-600);color:#fff"><span class="t">600</span></div>
    <div class="sw" style="background:var(--navy-500);color:#fff"><span class="t">500</span></div>
    <div class="sw" style="background:var(--navy-400);color:#fff"><span class="t">400</span></div>
    <div class="sw" style="background:var(--navy-300);color:#fff"><span class="t">300</span></div>
    <div class="sw" style="background:var(--navy-200);color:var(--navy-800)"><span class="t">200</span></div>
    <div class="sw" style="background:var(--navy-100);color:var(--navy-800)"><span class="t">100</span></div>
  </div>
</body></html>
